<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="51% of a security program is acknowledging the risk">
<rect width="900" height="330" fill="#fcfcfb"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#0b0b0b">51% of a security program is acknowledging the risk</text>
<text x="40" y="72" font-size="14.5" fill="#52514e">You cannot manage what nobody will admit is there.</text>
<rect x="40" y="150" width="418.2" height="64" rx="4" fill="#2a78d6"/><rect x="460.2" y="150" width="399.8" height="64" rx="4" fill="#d5d4cf"/><text x="62" y="190" font-size="19" font-weight="700" fill="#ffffff">51%</text><text x="112" y="190" font-size="15" fill="#ffffff">Acknowledging the risk</text><text x="482.2" y="190" font-size="15" fill="#0b0b0b">49%  Everything else</text><text x="40" y="260" font-size="13.5" fill="#52514e">Controls, tooling, frameworks, audits, and dashboards are the 49%.</text><text x="40" y="284" font-size="13.5" fill="#52514e">They only work once somebody with authority says out loud that the risk is real and owns it.</text></svg>